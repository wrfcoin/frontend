<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Temperature gradient background -->
  <defs>
    <linearGradient id="temp_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFCC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background map -->
  <rect width="400" height="300" fill="#F0F0F0" />
  
  <!-- Land masses -->
  <path d="M20,150 C40,100 120,80 180,120 C240,160 300,140 380,180 L380,280 L20,280 Z" fill="#E8E8E8" stroke="#CCCCCC" />
  
  <!-- Temperature overlay with gradient -->
  <path d="M20,150 C80,130 140,170 200,130 C260,90 320,110 380,150 L380,260 L20,260 Z" fill="url(#temp_gradient)" opacity="0.7" />
  
  <!-- Grid lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
  </g>
  
  <!-- Temperature indicators -->
  <g font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">
    <text x="50" y="120">32°C</text>
    <text x="150" y="160">28°C</text>
    <text x="250" y="130">22°C</text>
    <text x="350" y="170">16°C</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Temperature Forecast</text>
  
  <!-- Legend -->
  <g transform="translate(20, 20)">
    <rect width="80" height="15" fill="url(#temp_gradient)" />
    <text x="0" y="30" font-family="Arial" font-size="8">Cold</text>
    <text x="80" y="30" font-family="Arial" font-size="8" text-anchor="end">Hot</text>
  </g>
</svg>