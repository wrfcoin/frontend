<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Wind speed gradient -->
  <defs>
    <linearGradient id="wind_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F7FF;stop-opacity:0.3" />
      <stop offset="25%" style="stop-color:#CCF2FF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#99E6FF;stop-opacity:0.5" />
      <stop offset="75%" style="stop-color:#66D9FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#33CCFF;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background map -->
  <rect width="400" height="300" fill="#F0F0F0" />
  
  <!-- Land masses -->
  <path d="M20,150 C40,100 120,80 180,120 C240,160 300,140 380,180 L380,280 L20,280 Z" fill="#E8E8E8" stroke="#CCCCCC" />
  
  <!-- Wind overlay with gradient -->
  <path d="M20,120 C80,100 140,140 200,100 C260,60 320,80 380,110 L380,220 L20,220 Z" fill="url(#wind_gradient)" />
  
  <!-- Grid lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
  </g>
  
  <!-- Wind arrows -->
  <g stroke="#003366" stroke-width="1.5">
    <!-- Wind arrow function -->
    <g transform="translate(50, 80) rotate(45)">
      <line x1="0" y1="0" x2="15" y2="0" />
      <line x1="15" y1="0" x2="10" y2="-3" />
      <line x1="15" y1="0" x2="10" y2="3" />
    </g>
    
    <g transform="translate(100, 120) rotate(90)">
      <line x1="0" y1="0" x2="20" y2="0" />
      <line x1="20" y1="0" x2="15" y2="-5" />
      <line x1="20" y1="0" x2="15" y2="5" />
    </g>
    
    <g transform="translate(150, 90) rotate(135)">
      <line x1="0" y1="0" x2="25" y2="0" />
      <line x1="25" y1="0" x2="20" y2="-5" />
      <line x1="25" y1="0" x2="20" y2="5" />
    </g>
    
    <g transform="translate(200, 110) rotate(180)">
      <line x1="0" y1="0" x2="30" y2="0" />
      <line x1="30" y1="0" x2="25" y2="-5" />
      <line x1="30" y1="0" x2="25" y2="5" />
    </g>
    
    <g transform="translate(250, 80) rotate(225)">
      <line x1="0" y1="0" x2="20" y2="0" />
      <line x1="20" y1="0" x2="15" y2="-5" />
      <line x1="20" y1="0" x2="15" y2="5" />
    </g>
    
    <g transform="translate(300, 130) rotate(270)">
      <line x1="0" y1="0" x2="25" y2="0" />
      <line x1="25" y1="0" x2="20" y2="-5" />
      <line x1="25" y1="0" x2="20" y2="5" />
    </g>
    
    <g transform="translate(350, 100) rotate(315)">
      <line x1="0" y1="0" x2="15" y2="0" />
      <line x1="15" y1="0" x2="10" y2="-3" />
      <line x1="15" y1="0" x2="10" y2="3" />
    </g>
  </g>
  
  <!-- Wind speed indicators -->
  <g font-family="Arial" font-size="10" fill="#003366" text-anchor="middle">
    <text x="50" y="70">8 km/h</text>
    <text x="100" y="110">15 km/h</text>
    <text x="150" y="80">25 km/h</text>
    <text x="200" y="100">30 km/h</text>
    <text x="250" y="70">20 km/h</text>
    <text x="300" y="120">25 km/h</text>
    <text x="350" y="90">10 km/h</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Wind Speed and Direction</text>
  
  <!-- Legend -->
  <g transform="translate(20, 20)">
    <rect width="80" height="15" fill="url(#wind_gradient)" />
    <text x="0" y="30" font-family="Arial" font-size="8">Light</text>
    <text x="80" y="30" font-family="Arial" font-size="8" text-anchor="end">Strong</text>
  </g>
</svg>