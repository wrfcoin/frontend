<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Pressure gradient -->
  <defs>
    <linearGradient id="pressure_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9999;stop-opacity:0.7" />
      <stop offset="20%" style="stop-color:#FFCCCC;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="60%" style="stop-color:#CCCCFF;stop-opacity:0.6" />
      <stop offset="80%" style="stop-color:#9999FF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#6666FF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background map -->
  <rect width="400" height="300" fill="#F0F0F0" />
  
  <!-- Land masses -->
  <path d="M20,150 C40,100 120,80 180,120 C240,160 300,140 380,180 L380,280 L20,280 Z" fill="#E8E8E8" stroke="#CCCCCC" />
  
  <!-- Pressure overlay with gradient -->
  <path d="M0,0 L400,0 L400,300 L0,300 Z" fill="url(#pressure_gradient)" opacity="0.5" />
  
  <!-- Isobars (pressure contour lines) -->
  <g stroke="#000000" stroke-width="0.5" fill="none" opacity="0.7">
    <path d="M20,50 C80,40 140,70 200,60 C260,50 320,30 380,50" />
    <path d="M20,80 C80,70 140,100 200,90 C260,80 320,60 380,80" />
    <path d="M20,110 C80,100 140,130 200,120 C260,110 320,90 380,110" />
    <path d="M20,140 C80,130 140,160 200,150 C260,140 320,120 380,140" />
    <path d="M20,170 C80,160 140,190 200,180 C260,170 320,150 380,170" />
    <path d="M20,200 C80,190 140,220 200,210 C260,200 320,180 380,200" />
    <path d="M20,230 C80,220 140,250 200,240 C260,230 320,210 380,230" />
    <path d="M20,260 C80,250 140,280 200,270 C260,260 320,240 380,260" />
  </g>
  
  <!-- High and Low pressure labels -->
  <g>
    <!-- High pressure center -->
    <circle cx="100" cy="100" r="20" fill="#FF9999" opacity="0.6" />
    <text x="100" y="100" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" alignment-baseline="middle">H</text>
    <text x="100" y="115" font-family="Arial" font-size="10" text-anchor="middle">1020 hPa</text>
    
    <!-- Low pressure center -->
    <circle cx="300" cy="200" r="20" fill="#9999FF" opacity="0.6" />
    <text x="300" y="200" font-family="Arial" font-weight="bold" font-size="12" text-anchor="middle" alignment-baseline="middle">L</text>
    <text x="300" y="215" font-family="Arial" font-size="10" text-anchor="middle">995 hPa</text>
  </g>
  
  <!-- Grid lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
  </g>
  
  <!-- Pressure indicators -->
  <g font-family="Arial" font-size="10" text-anchor="middle">
    <text x="80" y="70">1015 hPa</text>
    <text x="180" y="130">1010 hPa</text>
    <text x="240" y="180">1005 hPa</text>
    <text x="320" y="230">1000 hPa</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Atmospheric Pressure</text>
  
  <!-- Legend -->
  <g transform="translate(20, 20)">
    <rect width="80" height="15" fill="url(#pressure_gradient)" />
    <text x="0" y="30" font-family="Arial" font-size="8">High</text>
    <text x="80" y="30" font-family="Arial" font-size="8" text-anchor="end">Low</text>
  </g>
</svg>