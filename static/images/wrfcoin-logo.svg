<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <style>
    .coin-outer { fill: #4361ee; }
    .coin-inner { fill: #3f37c9; }
    .w-letter { fill: #ffffff; }
    
    @media (prefers-color-scheme: dark) {
      .coin-outer { fill: #6665dd; }
      .coin-inner { fill: #7209b7; }
      .w-letter { fill: #ffffff; }
    }
  </style>
  <!-- Coin outline -->
  <circle class="coin-outer" cx="50" cy="50" r="45" />
  
  <!-- Inner circle -->
  <circle class="coin-inner" cx="50" cy="50" r="35" />
  
  <!-- W symbol -->
  <path class="w-letter" d="M 30 35 L 35 65 L 42 65 L 45 45 L 50 65 L 55 45 L 58 65 L 65 65 L 70 35 L 63 35 L 60 55 L 55 35 L 50 55 L 45 35 L 42 55 L 37 35 L 30 35 Z" />
  
  <!-- Data visualization elements representing computational analysis -->
  <circle class="w-letter" cx="30" cy="30" r="3" />
  <circle class="w-letter" cx="70" cy="30" r="3" />
  <circle class="w-letter" cx="30" cy="70" r="3" />
  <circle class="w-letter" cx="70" cy="70" r="3" />
  
  <!-- Connecting lines for data network representation -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="30" y1="30" x2="30" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="30" y1="30" x2="70" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="30" x2="70" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="70" y1="30" x2="30" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="30" y1="70" x2="70" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5" />
</svg>