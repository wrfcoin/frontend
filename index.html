<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>WRFCoin - Public Weather-Data Testnet</title>

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="background-color" content="#1976d2" />
    <meta
      name="description"
      content="A public weather-data testnet: personal weather stations contribute observations, forecasts are published against them, and the chain rewards verified contribution. Testnet tokens have no monetary value."
    />

    <!-- Same-origin preview assets for the public website. -->
    <link rel="canonical" href="https://wrfcoin.com/" />
    <meta property="og:url" content="https://wrfcoin.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WRFCoin - Public Weather-Data Testnet" />
    <meta
      property="og:description"
      content="A public weather-data testnet: personal weather stations contribute observations, forecasts are published against them, and the chain rewards verified contribution. Testnet tokens have no monetary value."
    />
    <meta property="og:image" content="https://wrfcoin.com/og-testnet.png" />
    <meta
      property="og:image:alt"
      content="WRFCoin public weather-data testnet"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WRFCoin - Public Weather-Data Testnet" />
    <meta
      name="twitter:description"
      content="A public weather-data testnet: personal weather stations contribute observations, forecasts are published against them, and the chain rewards verified contribution. Testnet tokens have no monetary value."
    />
    <meta name="twitter:image" content="https://wrfcoin.com/og-testnet.png" />
    <meta
      name="twitter:image:alt"
      content="WRFCoin public weather-data testnet"
    />

    <!-- Mobile Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WRFCoin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#1976d2" />

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />

    <!--
      Bootstrap CSS and web fonts (Inter / JetBrains Mono / Orbitron /
      Space Grotesk) are now vendored locally and imported via the bundler
      (src/main.jsx -> bootstrap/dist/css/bootstrap.min.css, src/styles/fonts.js).
      They are served same-origin from dist/, so the previous external <link>s to
      cdn.jsdelivr.net / fonts.googleapis.com / fonts.gstatic.com were removed.
      This lets the testnet CSP drop those origins from style-src / font-src.
    -->

    <!-- Critical CSS for mobile performance -->
    <style>
      /* Critical mobile styles for fast initial render */
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
        overscroll-behavior: none;
      }

      /* Prevent zoom on iOS */
      input,
      select,
      textarea,
      button {
        font-size: 16px;
      }

      /* Safe area handling for devices with notch */
      .safe-area-inset {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Loading screen */
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #1976d2 0%, #42a5f5 100%);
        color: white;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Hide app content until React loads */
      #root:empty::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #1976d2 0%, #42a5f5 100%);
        z-index: 9999;
      }

      #root:empty::after {
        content: 'Loading WRFCoin testnet...';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
        font-weight: 500;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
